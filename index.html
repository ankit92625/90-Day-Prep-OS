<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>90-Day Prep OS</title>
<style>
:root{--bg:#eef1f5;--pn:#fff;--ink:#0f1b2d;--mu:#5b6779;--ln:#d6dce6;--ac:#2b59e0;--ok:#16915f;--bad:#c93a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1420;--pn:#162033;--ink:#e6ecf5;--mu:#93a1b8;--ln:#2a3a54;--ac:#6d8dff}}
:root[data-theme=dark]{--bg:#0d1420;--pn:#162033;--ink:#e6ecf5;--mu:#93a1b8;--ln:#2a3a54;--ac:#6d8dff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pn);border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center;padding:8px 12px;z-index:5}
header b{white-space:nowrap}nav{display:flex;gap:4px;overflow-x:auto;flex:1}
button,select,input,textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
nav button{border:0;background:none;white-space:nowrap;color:var(--mu)}nav button.on{background:var(--ac);color:#fff}
main{max-width:920px;margin:0 auto;padding:16px 12px 60px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px;margin:0 0 12px}
h2{margin:4px 0 12px;font-size:22px}h3{margin:0 0 6px;font-size:16px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.big{font-size:28px;font-weight:600}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
details{margin:6px 0}summary{cursor:pointer;color:var(--ac)}pre{background:var(--bg);padding:10px;border-radius:6px;overflow-x:auto;font:13px "IBM Plex Mono",monospace}
.on2{background:var(--ac);color:#fff;border-color:var(--ac)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.sw{width:22px;height:22px;padding:0;border-radius:50%}.sw.sel{outline:2px solid var(--ink)}
#art{padding:14px;line-height:1.8;background:var(--pn);border:1px solid var(--ln);border-radius:8px}.hl{color:#111;border-radius:2px}
input[type=text],textarea{width:100%}label{display:block;margin:4px 0}
#tb{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:var(--pn);border-bottom:1px solid var(--ln);padding:6px 12px}.fb{font-weight:700}.fi{font-style:italic}.fu{text-decoration:underline}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style></head><body>
<header><b>Prep OS</b><nav id="nav" aria-label="Sections"></nav><button data-a="theme" aria-label="Toggle theme">◐</button></header>
<div id="tb" class="row" role="toolbar" aria-label="Highlighter"></div><main id="v"></main>
<script>
const $=(s,e=document)=>e.querySelector(s),K='prepos1',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ST;try{ST=JSON.parse(localStorage.getItem(K))}catch(e){}
ST=Object.assign({start:new Date().toISOString().slice(0,10),dsaT:300,apT:2500,days:90,dsaBase:0,apBase:0,mins:0,tab:'today',tasks:[{t:'DSA: 5 problems',d:0},{t:'Aptitude: 30 questions',d:0},{t:'Core CS: 1 topic',d:0},{t:'Revision: 30 min',d:0}],dsa:{},ap:{},flag:{},cards:{},fav:{},hl:null,notes:[],apps:[],rev:[],tests:[],theme:''},ST||{});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(ST))}catch(e){}};
const h=s=>{$('#v').innerHTML=s;applyAll()},today=()=>new Date().toISOString().slice(0,10),addD=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const day=()=>Math.min(ST.days,Math.max(1,Math.floor((new Date(today())-new Date(ST.start))/864e5)+1)),cnt=s=>Object.values(ST.dsa).filter(v=>v==s).length;
if(ST.theme)document.documentElement.dataset.theme=ST.theme;
const P=[
{t:'Two Sum',d:'Easy',p:'Hash Map',s:'Given an int array and a target, return the indices of two numbers that add up to the target.',h:'For each value, what number would complete the sum?',a:'One pass with a HashMap of value→index. Check the complement before inserting the current value.',c:'int[] twoSum(int[] a,int t){\n  Map<Integer,Integer> m=new HashMap<>();\n  for(int i=0;i<a.length;i++){\n    if(m.containsKey(t-a[i])) return new int[]{m.get(t-a[i]),i};\n    m.put(a[i],i);\n  }\n  return new int[0];\n}',x:'Time O(n): one pass, O(1) lookups. Space O(n): the map.'},
{t:'Valid Palindrome',d:'Easy',p:'Two Pointer',s:'Check whether a string reads the same both ways, ignoring non-alphanumeric characters and case.',h:'Compare from both ends moving inward.',a:'Left and right pointers; skip non-alphanumerics; compare lowercase characters.',c:'boolean isPal(String s){\n  int i=0,j=s.length()-1;\n  while(i<j){\n    while(i<j&&!Character.isLetterOrDigit(s.charAt(i)))i++;\n    while(i<j&&!Character.isLetterOrDigit(s.charAt(j)))j--;\n    if(Character.toLowerCase(s.charAt(i++))!=Character.toLowerCase(s.charAt(j--)))return false;\n  }\n  return true;\n}',x:'Time O(n): each pointer crosses the string once. Space O(1).'},
{t:'Max Sum of Size-k Subarray',d:'Easy',p:'Sliding Window',s:'Find the maximum sum of any k contiguous elements.',h:'When the window moves, only two elements change.',a:'Sum the first k, then slide: add the new element, subtract the one leaving.',c:'int maxSum(int[] a,int k){\n  int s=0,best;\n  for(int i=0;i<k;i++)s+=a[i];\n  best=s;\n  for(int i=k;i<a.length;i++){s+=a[i]-a[i-k];best=Math.max(best,s);}\n  return best;\n}',x:'Time O(n). Space O(1). Brute force is O(n·k).'},
{t:'Binary Search',d:'Easy',p:'Binary Search',s:'Find a target in a sorted array; return its index or -1.',h:'Halve the search range each step.',a:'Keep low/high; compare arr[mid] to the target and discard half.',c:'int search(int[] a,int t){\n  int lo=0,hi=a.length-1;\n  while(lo<=hi){\n    int mid=lo+(hi-lo)/2;\n    if(a[mid]==t)return mid;\n    if(a[mid]<t)lo=mid+1;else hi=mid-1;\n  }\n  return -1;\n}',x:'Time O(log n): the range halves. Space O(1). Use lo+(hi-lo)/2 to avoid overflow.'},
{t:'Reverse Linked List',d:'Easy',p:'Linked List',s:'Reverse a singly linked list and return the new head.',h:'Keep track of the previous node as you walk.',a:'Iterate; save next, point current.next to prev, advance both.',c:'ListNode reverse(ListNode head){\n  ListNode prev=null;\n  while(head!=null){\n    ListNode nx=head.next;\n    head.next=prev;prev=head;head=nx;\n  }\n  return prev;\n}',x:'Time O(n). Space O(1).'},
{t:'Valid Parentheses',d:'Easy',p:'Stack',s:'Given a string of ()[]{} decide whether brackets are balanced and correctly nested.',h:'The most recent opener must close first.',a:'Push openers; on a closer, the stack top must be its match.',c:'boolean valid(String s){\n  Deque<Character> st=new ArrayDeque<>();\n  for(char c:s.toCharArray()){\n    if("([{".indexOf(c)>=0)st.push(c);\n    else{\n      if(st.isEmpty())return false;\n      char o=st.pop();\n      if("([{".indexOf(o)!=")]}".indexOf(c))return false;\n    }\n  }\n  return st.isEmpty();\n}',x:'Time O(n). Space O(n).'},
{t:'Number of Islands',d:'Medium',p:'DFS',s:'Count groups of connected 1s (4-directional) in a grid of 0s and 1s.',h:'Sink each island once you find it.',a:'Scan the grid; on a 1, count++ and DFS to mark the whole island visited.',c:'int islands(char[][] g){\n  int n=0;\n  for(int i=0;i<g.length;i++)for(int j=0;j<g[0].length;j++)\n    if(g[i][j]==\'1\'){n++;dfs(g,i,j);}\n  return n;\n}\nvoid dfs(char[][] g,int i,int j){\n  if(i<0||j<0||i>=g.length||j>=g[0].length||g[i][j]!=\'1\')return;\n  g[i][j]=\'0\';\n  dfs(g,i+1,j);dfs(g,i-1,j);dfs(g,i,j+1);dfs(g,i,j-1);\n}',x:'Time O(R·C): each cell visited once. Space O(R·C) worst-case recursion.'},
{t:'Climbing Stairs',d:'Easy',p:'Dynamic Programming',s:'You climb 1 or 2 steps at a time. In how many ways can you reach step n?',h:'Ways(n) depends on the previous two steps.',a:'ways(n)=ways(n-1)+ways(n-2); keep only two variables.',c:'int climb(int n){\n  int a=1,b=1;\n  for(int i=2;i<=n;i++){int c=a+b;a=b;b=c;}\n  return b;\n}',x:'Time O(n). Space O(1). Plain recursion is O(2^n).'}];
const Q=[
{g:'Aptitude',tp:'Percentage',q:'A number is increased by 20% then decreased by 20%. Net change?',o:['4% increase','4% decrease','No change','2% decrease'],a:1,sc:'Net = 20−20−(20×20)/100 = −4%.',e:'100→120→96, a 4% decrease.'},
{g:'Aptitude',tp:'Speed',q:'72 km/h expressed in m/s is:',o:['18','20','22','25'],a:1,sc:'Multiply km/h by 5/18.',e:'72×5/18=20 m/s.'},
{g:'Aptitude',tp:'Interest',q:'Simple interest on ₹5000 at 10% p.a. for 2 years:',o:['₹500','₹1000','₹1100','₹1500'],a:1,sc:'P×R×T/100.',e:'5000×10×2/100=1000.'},
{g:'Aptitude',tp:'Series',q:'Next term: 2, 6, 12, 20, ?',o:['28','30','32','36'],a:1,sc:'Differences grow by 2 (n·(n+1)).',e:'Differences 4,6,8,10 → 20+10=30.'},
{g:'Aptitude',tp:'Time & Work',q:'A finishes a job in 10 days, B in 15. Together they take:',o:['5','6','7.5','8'],a:1,sc:'(a×b)/(a+b).',e:'150/25=6 days.'},
{g:'Core',tp:'DBMS',q:'Which is NOT part of ACID?',o:['Atomicity','Consistency','Isolation','Availability'],a:3,sc:'ACID = A, C, I, Durability.',e:'The D stands for Durability, not Availability.'},
{g:'Core',tp:'CN',q:'TCP three-way handshake order:',o:['SYN, ACK, SYN','SYN, SYN-ACK, ACK','ACK, SYN, SYN-ACK','SYN-ACK, SYN, ACK'],a:1,sc:'Client SYN → server SYN-ACK → client ACK.',e:'This sets up sequence numbers on both sides.'},
{g:'Core',tp:'DSA',q:'Time complexity of binary search:',o:['O(n)','O(log n)','O(n log n)','O(1)'],a:1,sc:'Range halves each step.',e:'log₂ n halvings until one element remains.'},
{g:'Core',tp:'OS',q:'Threads of the same process share:',o:['Stack','Registers','Heap memory','Program counter'],a:2,sc:'Stack/registers/PC are per-thread.',e:'Heap and code/data segments are shared.'},
{g:'Core',tp:'SQL',q:'Which join keeps all rows of the left table?',o:['INNER','LEFT','CROSS','SELF'],a:1,sc:'LEFT = all left rows, NULL for no match.',e:'INNER drops unmatched rows on both sides.'}];
const F=[['What is a process?','A program in execution with its own address space, registers and OS-managed resources.'],['Process vs thread?','Threads live inside a process and share its memory; processes are isolated.'],['What is normalization?','Organizing tables to reduce redundancy and update anomalies (1NF, 2NF, 3NF, BCNF).'],['What does ACID stand for?','Atomicity, Consistency, Isolation, Durability.'],['TCP vs UDP?','TCP is connection-oriented and reliable; UDP is connectionless and faster.'],['What is a deadlock?','Processes wait forever for resources held by each other: mutual exclusion, hold-and-wait, no preemption, circular wait.'],['Overloading vs overriding?','Overloading: same name, different parameters (compile time). Overriding: subclass redefines a method (runtime).'],['What is an index?','A data structure (usually B+ tree) that speeds up lookups by avoiding full table scans.']];
const READ=`<h3>Process vs Thread</h3><p>A process is a program in execution. When you open Chrome, the operating system creates a process, allocates memory, and lets the CPU run its instructions. Each process has its own address space.</p><p>A thread is a smaller unit of execution inside a process. Threads of one process share the heap and code, but each has its own stack and registers.</p><p>Creating a thread is cheaper than creating a process, and threads communicate through shared memory. The trade-off is weaker failure isolation: one crashing thread can bring down the whole process.</p><p>Interview tip: mention the PCB, context switching, and a real example such as a browser with one process per tab.</p>`;
const C=[['Yellow','#fde047'],['Green','#86efac'],['Blue','#93c5fd'],['Pink','#f9a8d4'],['Orange','#fdba74'],['Purple','#c4b5fd'],['Red','#fca5a5'],['Cyan','#67e8f9'],['Lime','#bef264'],['Teal','#5eead4'],['Indigo','#a5b4fc'],['Violet','#ddd6fe'],['Rose','#fda4af'],['Amber','#fcd34d'],['Emerald','#6ee7b7'],['Sky','#7dd3fc'],['Fuchsia','#f0abfc'],['Slate','#cbd5e1'],['Brown','#d6b48e'],['Gold','#f5d76e'],['Gray','#d1d5db']];
const TABS={today:'Today',dsa:'DSA',apt:'Aptitude',read:'Reader',cards:'Flashcards',mock:'Mock test',notes:'Notes',track:'Applications'};
$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-a="go" data-k="${k}">${v}</button>`).join('');
const bar=p=>`<div class="bar"><i style="width:${Math.min(100,p)}%"></i></div>`;
let T={id:0,left:0,m:0};
const V={};
V.today=()=>{const n=day(),left=Math.max(1,ST.days-n+1),ds=ST.dsaBase+cnt('solved'),ap=ST.apBase+Object.keys(ST.ap).length,rd=Math.ceil(Math.max(0,ST.dsaT-ds)/left),ra=Math.ceil(Math.max(0,ST.apT-ap)/left),due=ST.rev.filter(r=>r.due<=today()),dn=ST.tasks.filter(t=>t.d).length,pc=ST.tasks.length?Math.round(dn/ST.tasks.length*100):0;
h(`<h2>Day ${n} of ${ST.days}</h2><div class="card">${bar(n/ST.days*100)}<p class="mu">Target: ${ST.dsaT} DSA problems and ${ST.apT} aptitude questions. Numbers below recalculate from what you've done.</p></div>
<div class="g"><div class="card"><div class="mu">DSA per day</div><div class="big">${rd}</div><div class="mu">${ds}/${ST.dsaT} done, ${left} days left</div></div><div class="card"><div class="mu">Aptitude per day</div><div class="big">${ra}</div><div class="mu">${ap}/${ST.apT} done</div></div><div class="card"><div class="mu">Study time</div><div class="big">${Math.round(ST.mins/6)/10} h</div><div class="mu">Weak topics: ${Object.values(ST.flag).filter(Boolean).length}</div></div></div>
<div class="card"><h3>Today's tasks (${pc}%)</h3>${bar(pc)}${ST.tasks.map((t,i)=>`<label><input type="checkbox" data-a="tk" data-i="${i}" ${t.d?'checked':''}> ${esc(t.t)} <button data-a="tdel" data-i="${i}" aria-label="Delete task">×</button></label>`).join('')}<div class="row"><input id="nt" type="text" placeholder="Add a task" style="flex:1"><button data-a="tadd">Add task</button><button data-a="treset">Reset day</button></div></div>
<div class="card"><h3>Revision due today (${due.length})</h3>${due.length?due.map(r=>`<div class="row">${esc(r.n)} <span class="mu">(day +${r.d} review)</span><button data-a="rdone" data-i="${ST.rev.indexOf(r)}">Done</button></div>`).join(''):'<p class="mu">Nothing due. Mark DSA problems as solved to schedule reviews on days 1, 3, 7, 14, 30 and 60.</p>'}</div>
<div class="card"><h3>Study timer</h3><div class="big" id="tm">${T.left?fm(T.left):'--:--'}</div><div class="row"><button data-a="tm" data-m="25">25 min</button><button data-a="tm" data-m="50">50 min</button><button data-a="tm" data-m="0">Stop</button></div></div>
<div class="card"><h3>Settings</h3><div class="row"><label>DSA target <input id="s1" type="number" value="${ST.dsaT}" style="width:90px"></label><label>Aptitude target <input id="s2" type="number" value="${ST.apT}" style="width:90px"></label><label>Days <input id="s3" type="number" value="${ST.days}" style="width:70px"></label><label>DSA already solved <input id="s4" type="number" value="${ST.dsaBase}" style="width:90px"></label><label>Aptitude already done <input id="s5" type="number" value="${ST.apBase}" style="width:90px"></label><label>Start date <input id="s6" type="date" value="${ST.start}"></label></div><button data-a="sset">Save settings</button></div>`)};
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
V.dsa=()=>{const pats=[...new Set(P.map(p=>p.p))],f=ST.pf||'';
h(`<h2>DSA practice</h2><div class="card"><h3>Pattern dashboard</h3>${pats.map(p=>{const l=P.filter(x=>x.p==p),s=l.filter(x=>ST.dsa[x.t]=='solved').length;return`<div class="row"><span style="width:150px">${p}</span><span style="flex:1">${bar(s/l.length*100)}</span><span class="mu">${s}/${l.length}</span></div>`}).join('')}</div>
<select data-a="pf" aria-label="Filter pattern"><option value="">All patterns</option>${pats.map(p=>`<option ${f==p?'selected':''}>${p}</option>`).join('')}</select>
${P.filter(p=>!f||p.p==f).map(p=>`<div class="card"><h3>${p.t} <span class="mu">${p.d} · ${p.p}</span></h3><p>${p.s}</p><details><summary>Show hint</summary>${p.h}</details><details><summary>Show approach</summary>${p.a}</details><details><summary>Show answer</summary><pre>${esc(p.c)}</pre><p>${p.x}</p></details><div class="row"><span class="mu">Status: ${ST.dsa[p.t]||'not started'}</span>${[['solved','I solved it'],['failed',"I couldn't solve it"],['review','Review later']].map(([k,l])=>`<button data-a="ds" data-t="${p.t}" data-k="${k}" class="${ST.dsa[p.t]==k?'on2':''}">${l}</button>`).join('')}<button data-a="wk" data-t="${p.t}" class="${ST.flag[p.t]?'on2':''}">Weak topic</button></div></div>`).join('')}`)};
V.apt=()=>h(`<h2>Aptitude</h2>`+Q.filter(q=>q.g=='Aptitude').map((q,i)=>{const k='a'+i;return`<div class="card"><h3>${q.q} <span class="mu">${q.tp}</span></h3>${q.o.map((o,j)=>`<div>${'ABCD'[j]}. ${o}</div>`).join('')}<details data-k="${k}"><summary>Show answer and explanation</summary><b>${'ABCD'[q.a]}. ${q.o[q.a]}</b><p>${q.e}</p><p class="mu">Shortcut: ${q.sc}</p></details><div class="row"><button data-a="bk" data-t="${k}" class="${ST.flag[k]?'on2':''}">Mark difficult</button></div></div>`}).join(''));
/* Highlighter: works on every page */
let mode=null,col='#fde047',UN=[],RE=[],pal=false;
const VW=()=>$('#v'),TX=()=>{const w=document.createTreeWalker(VW(),4),a=[];let n;while(n=w.nextNode())a.push(n);return a},FULL=()=>TX().map(n=>n.data).join('');
const HL=()=>{ST.H=ST.H||{};return ST.H[ST.tab]=ST.H[ST.tab]||[]};
function off(n,o){const r=document.createRange();r.selectNodeContents(VW());r.setEnd(n,o);return r.toString().length}
function selR(){const s=getSelection();if(!s.rangeCount||s.isCollapsed)return null;const r=s.getRangeAt(0);if(!VW().contains(r.commonAncestorContainer))return null;const a=off(r.startContainer,r.startOffset),b=off(r.endContainer,r.endOffset);return b>a?[a,b]:null}
const mk=(s,e,c,f)=>({s,t:f.slice(s,e),b:f.slice(Math.max(0,s-24),s),c});
function paint(s,e,c){let p=0;TX().forEach(n=>{const L=n.data.length,o=p,a=Math.max(s,o),b=Math.min(e,o+L);p+=L;if(b<=a||!n.data.trim()||n.parentNode.closest('button,select,textarea,option'))return;const r=document.createRange();r.setStart(n,a-o);r.setEnd(n,b-o);const el=document.createElement('span');if(c.length>1){el.className='hl';el.style.background=c}else el.className='f'+c;r.surroundContents(el)})}
function applyAll(){const f=FULL();HL().forEach(r=>{let i=f.indexOf(r.b+r.t);if(i>=0)i+=r.b.length;else if(r.t.length>15)i=f.indexOf(r.t);if(i>=0){r.s=i;paint(i,i+r.t.length,r.c)}})}
const snap=()=>{UN.push(JSON.stringify(ST.H||{}));if(UN.length>50)UN.shift();RE=[]};
function rebuild(){VW().querySelectorAll('.hl,.fb,.fi,.fu').forEach(x=>x.replaceWith(...x.childNodes));VW().normalize();applyAll();save()}
function add(c){const r=selR();if(!r)return;snap();HL().push(mk(r[0],r[1],c,FULL()));paint(r[0],r[1],c);getSelection().removeAllRanges();save()}
function erase(){const r=selR();if(!r)return;snap();const f=FULL(),n=[];HL().forEach(x=>{const e=x.s+x.t.length;if(x.c.length==1||e<=r[0]||x.s>=r[1]){n.push(x);return}if(x.s<r[0])n.push(mk(x.s,r[0],x.c,f));if(e>r[1])n.push(mk(r[1],e,x.c,f))});ST.H[ST.tab]=n;getSelection().removeAllRanges();rebuild()}
function tbr(){$('#tb').innerHTML=`<button class="sw sel" data-a="pal" style="background:${col}" title="Colors" aria-label="Choose highlight color"></button><button data-a="mode" data-m="hl" class="${mode=='hl'?'on2':''}">Highlight</button><button data-a="mode" data-m="er" class="${mode=='er'?'on2':''}">Eraser</button><button data-a="fmt" data-t="b"><b>B</b></button><button data-a="fmt" data-t="i"><i>I</i></button><button data-a="fmt" data-t="u"><u>U</u></button><button data-a="undo">Undo</button><button data-a="redo">Redo</button><button data-a="rnote">Add note</button><button data-a="hclr">Clear page</button>${mode=='er'?'<b>ERASER ACTIVE</b>':mode=='hl'?'<span class="mu">Select any text</span>':''}${pal?`<div class="row" style="width:100%">${C.map(([n,c])=>`<button class="sw ${c==col?'sel':''}" data-a="col" data-c="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('')}</div>`:''}`}
V.read=()=>h(`<h2>Reader</h2><article id="art">${READ}</article><p class="mu">The highlighter bar above works on every page: DSA, aptitude, flashcards, notes and results. Highlights are saved per page and survive a refresh.</p>`);
V.cards=()=>{const i=ST.ci||0,c=F[i],s=ST.cs;h(`<h2>Flashcards</h2><div class="card"><div class="mu">Card ${i+1}/${F.length} · Known ${Object.values(ST.cards).filter(v=>v=='know').length}</div><h3 style="font-size:20px">${c[0]}</h3>${s?`<p>${c[1]}</p><div class="row">${[['know','Know'],['dont',"Don't know"],['review','Review']].map(([k,l])=>`<button data-a="cd" data-k="${k}" class="${ST.cards[i]==k?'on2':''}">${l}</button>`).join('')}<button data-a="cfav" class="${ST.fav[i]?'on2':''}">Favorite</button></div>`:'<button data-a="cshow">Show answer</button>'}<div class="row" style="margin-top:8px"><button data-a="cnav" data-d="-1">Previous</button><button data-a="cnav" data-d="1">Next</button></div></div>`)};
let M=null;
V.mock=()=>{if(!M)return h(`<h2>Mock test</h2><div class="card"><div class="row"><label>Questions <select id="mq"><option>5</option><option selected>10</option></select></label><label>Minutes <select id="mt"><option>5</option><option selected>10</option><option>20</option></select></label><label>Type <select id="mg"><option>Mixed</option><option>Aptitude</option><option>Core</option></select></label></div><button data-a="mstart">Start test</button><p class="mu">Answers stay hidden until you submit.${ST.tests.length?' Last score: '+ST.tests.slice(-1)[0].s+'/'+ST.tests.slice(-1)[0].n:''}</p></div>`);
if(M.done){const w=M.q.filter((q,i)=>M.ans[i]!=q.a);return h(`<h2>Result: ${M.q.length-w.length}/${M.q.length}</h2><div class="card"><div class="big">${Math.round((M.q.length-w.length)/M.q.length*100)}% accuracy</div><p>Weak topics: ${[...new Set(w.map(q=>q.tp))].join(', ')||'none'}</p></div>${M.q.map((q,i)=>`<div class="card"><b class="${M.ans[i]==q.a?'ok':'bad'}">${M.ans[i]==q.a?'Correct':'Wrong'}</b> ${q.q}<p>Answer: ${q.o[q.a]}. ${q.e}</p></div>`).join('')}<button data-a="mend">New test</button>`)}
const q=M.q[M.i];h(`<h2>Question ${M.i+1}/${M.q.length} <span id="mtm" class="mu"></span></h2><div class="card"><p>${q.q}</p>${q.o.map((o,j)=>`<label><input type="radio" name="o" data-a="pick" data-j="${j}" ${M.ans[M.i]===j?'checked':''}> ${o}</label>`).join('')}<div class="row"><button data-a="mnav" data-d="-1">Previous</button><button data-a="mnav" data-d="1">Next</button><button data-a="mmark" class="${M.mk[M.i]?'on2':''}">Mark for review</button><button data-a="msub">Submit</button></div><p class="mu">Answered ${Object.keys(M.ans).length}/${M.q.length} · Marked ${Object.values(M.mk).filter(Boolean).length}</p></div>`)};
V.notes=()=>{const s=(ST.ns||'').toLowerCase(),l=ST.notes.map((n,i)=>({...n,i})).filter(n=>n.x.toLowerCase().includes(s)).sort((a,b)=>b.p-a.p);h(`<h2>Notes</h2><div class="card"><textarea id="nx" rows="3" placeholder="Write a note"></textarea><div class="row"><button data-a="nadd">Save note</button><input id="ns" type="text" placeholder="Search notes" value="${esc(ST.ns||'')}" style="flex:1"></div></div>${l.map(n=>`<div class="card">${n.p?'📌 ':''}${esc(n.x)}<div class="mu">${n.d}</div><div class="row"><button data-a="npin" data-i="${n.i}">${n.p?'Unpin':'Pin'}</button><button data-a="ndel" data-i="${n.i}">Delete</button></div></div>`).join('')||'<p class="mu">No notes yet. Add one above, or select text in the Reader and press Add note.</p>'}`)};
const STS=['Saved','Applied','OA','Interview','Selected','Rejected','On Hold'];
V.track=()=>h(`<h2>Applications</h2><div class="card"><div class="row"><input id="ac" type="text" placeholder="Company" style="flex:1"><input id="ar" type="text" placeholder="Role" style="flex:1"><button data-a="aadd">Add application</button></div></div>${ST.apps.map((a,i)=>`<div class="card row"><b>${esc(a.c)}</b><span class="mu">${esc(a.r)}</span><select data-a="ast" data-i="${i}">${STS.map(s=>`<option ${a.s==s?'selected':''}>${s}</option>`).join('')}</select><button data-a="adel" data-i="${i}">Delete</button></div>`).join('')||'<p class="mu">Track each company from Saved to Selected.</p>'}<p class="mu">${STS.map(s=>s+': '+ST.apps.filter(a=>a.s==s).length).join(' · ')}</p>`);
function go(k){ST.tab=k;save();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));V[k]()}
const A={go:e=>go(e.dataset.k),theme:()=>{const d=document.documentElement,x=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';d.dataset.theme=ST.theme=x;save()},
tk:e=>{ST.tasks[e.dataset.i].d=e.checked?1:0;save();V.today()},tdel:e=>{ST.tasks.splice(e.dataset.i,1);save();V.today()},tadd:()=>{const v=$('#nt').value.trim();if(v){ST.tasks.push({t:v,d:0});save();V.today()}},treset:()=>{ST.tasks.forEach(t=>t.d=0);save();V.today()},
rdone:e=>{ST.rev.splice(e.dataset.i,1);save();V.today()},
sset:()=>{ST.dsaT=+$('#s1').value;ST.apT=+$('#s2').value;ST.days=+$('#s3').value||90;ST.dsaBase=+$('#s4').value;ST.apBase=+$('#s5').value;ST.start=$('#s6').value||ST.start;save();V.today()},
tm:e=>{clearInterval(T.id);const m=+e.dataset.m;if(!m){T.left=0;return V.today()}T.m=m;T.left=m*60;T.id=setInterval(()=>{T.left--;if($('#tm'))$('#tm').textContent=fm(Math.max(0,T.left));if(T.left<=0){clearInterval(T.id);ST.mins+=T.m;save();alert('Session complete. Take a break.')}},1000)},
pf:e=>{ST.pf=e.value;V.dsa()},ds:e=>{const t=e.dataset.t;if(ST.dsa[t]!='solved'&&e.dataset.k=='solved')[1,3,7,14,30,60].forEach(d=>ST.rev.push({n:t,due:addD(d),d}));ST.dsa[t]=e.dataset.k;if(e.dataset.k!='solved')ST.flag[t]=1;save();V.dsa()},wk:e=>{ST.flag[e.dataset.t]=!ST.flag[e.dataset.t];save();V.dsa()},bk:e=>{ST.flag[e.dataset.t]=!ST.flag[e.dataset.t];e.classList.toggle('on2');save()},
pal:()=>{pal=!pal;tbr()},col:e=>{col=e.dataset.c;pal=false;tbr();if(selR()&&mode!='er')add(col)},
mode:e=>{mode=mode==e.dataset.m?null:e.dataset.m;tbr();if(mode=='er')erase();else if(mode=='hl')add(col)},
fmt:e=>add(e.dataset.t),undo:()=>{if(!UN.length)return;RE.push(JSON.stringify(ST.H||{}));ST.H=JSON.parse(UN.pop());rebuild()},redo:()=>{if(!RE.length)return;UN.push(JSON.stringify(ST.H||{}));ST.H=JSON.parse(RE.pop());rebuild()},
hclr:()=>{HL();snap();ST.H[ST.tab]=[];rebuild()},
rnote:()=>{const r=selR();if(r){ST.notes.push({x:FULL().slice(r[0],r[1]),d:new Date().toLocaleString(),p:0});save();alert('Saved to Notes')}},
cshow:()=>{ST.cs=1;V.cards()},cd:e=>{ST.cards[ST.ci||0]=e.dataset.k;save();V.cards()},cfav:()=>{ST.fav[ST.ci||0]=!ST.fav[ST.ci||0];save();V.cards()},cnav:e=>{ST.ci=((ST.ci||0)+ +e.dataset.d+F.length)%F.length;ST.cs=0;save();V.cards()},
mstart:()=>{const n=+$('#mq').value,g=$('#mg').value,pool=Q.filter(q=>g=='Mixed'||q.g==g).sort(()=>Math.random()-.5).slice(0,n);M={q:pool,i:0,ans:{},mk:{},end:Date.now()+$('#mt').value*6e4};M.id=setInterval(()=>{const l=Math.round((M.end-Date.now())/1000);if($('#mtm'))$('#mtm').textContent='⏱ '+fm(Math.max(0,l));if(l<=0)A.msub()},1000);V.mock()},
pick:e=>{M.ans[M.i]=+e.dataset.j},mnav:e=>{M.i=Math.min(M.q.length-1,Math.max(0,M.i+ +e.dataset.d));V.mock()},mmark:()=>{M.mk[M.i]=!M.mk[M.i];V.mock()},
msub:()=>{if(!M||M.done)return;clearInterval(M.id);M.done=1;ST.tests.push({s:M.q.filter((q,i)=>M.ans[i]==q.a).length,n:M.q.length,d:today()});save();V.mock()},mend:()=>{M=null;V.mock()},
nadd:()=>{const v=$('#nx').value.trim();if(v){ST.notes.push({x:v,d:new Date().toLocaleString(),p:0});save();V.notes()}},npin:e=>{const n=ST.notes[e.dataset.i];n.p=n.p?0:1;save();V.notes()},ndel:e=>{ST.notes.splice(e.dataset.i,1);save();V.notes()},
aadd:()=>{const c=$('#ac').value.trim();if(c){ST.apps.push({c,r:$('#ar').value,s:'Saved'});save();V.track()}},ast:e=>{ST.apps[e.dataset.i].s=e.value;save();V.track()},adel:e=>{ST.apps.splice(e.dataset.i,1);save();V.track()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!['SELECT','INPUT'].includes(b.tagName)||b&&b.type=='checkbox'||b&&b.type=='radio')A[b.dataset.a](b)});
document.addEventListener('change',e=>{const b=e.target.closest('[data-a]');if(b&&(b.tagName=='SELECT'||b.type=='checkbox'))A[b.dataset.a](b)});
document.addEventListener('input',e=>{if(e.target.id=='ns'){ST.ns=e.target.value;clearTimeout(window.dt);window.dt=setTimeout(()=>{V.notes();const n=$('#ns');n.focus();n.setSelectionRange(99,99)},250)}});
document.addEventListener('mousedown',e=>{if(e.target.closest('#tb button'))e.preventDefault()});
['mouseup','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(mode)setTimeout(()=>mode=='er'?erase():add(col),0)}));
let st2;document.addEventListener('selectionchange',()=>{if(!mode||!matchMedia('(pointer:coarse)').matches)return;clearTimeout(st2);st2=setTimeout(()=>{if(selR())mode=='er'?erase():add(col)},800)});
tbr();go(TABS[ST.tab]?ST.tab:'today');
</script></body></html>
